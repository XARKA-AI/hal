<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>HAL Offshore — Maintenance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand-blue: #0b1f3a;
        --brand-gold: #d4a84b;
        --bg: #051020;
        --text: #f4f6f9;
        --muted: rgba(244, 246, 249, 0.72);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        font-family: "Open Sans", system-ui, sans-serif;
        background: radial-gradient(
            ellipse 120% 80% at 50% -20%,
            rgba(212, 168, 75, 0.12),
            transparent 55%
          ),
          var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      .card {
        max-width: 36rem;
        width: 100%;
        padding: 2.5rem 2rem;
        border-radius: 0.75rem;
        background: rgba(11, 31, 58, 0.65);
        border: 1px solid rgba(212, 168, 75, 0.25);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        text-align: center;
      }
      .badge {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--brand-gold);
        margin-bottom: 1rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.75rem;
        font-weight: 700;
        line-height: 1.2;
        color: var(--text);
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.65;
        font-size: 1rem;
      }
      .accent {
        margin-top: 1.75rem;
        height: 3px;
        width: 4rem;
        margin-left: auto;
        margin-right: auto;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--brand-gold), transparent);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">Scheduled maintenance</span>
      <h1>We’ll be back shortly</h1>
      <p>
        HAL Offshore is temporarily unavailable while we improve our systems.
        Thank you for your patience.
      </p>
      <div class="accent" aria-hidden="true"></div>
    </main>
  </body>
</html>
